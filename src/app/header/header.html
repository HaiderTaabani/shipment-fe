<header
  class="sticky top-0 z-50 w-full border-b border-[var(--border)] bg-[var(--bg-secondary)]"
>
  <div
    class="mx-auto grid h-20 w-full max-w-7xl grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center px-4"
  >
    <div class="relative justify-self-start">
      <button
        type="button"
        class="flex items-center gap-2 border border-[var(--border)] px-3 py-2 font-semibold text-[var(--text-primary)] hover:border-[var(--accent)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)] focus:ring-offset-2"
        aria-controls="accessibility-panel"
        [attr.aria-expanded]="isAccessibilityPanelOpen()"
        (click)="toggleAccessibilityPanel()"
      >
        <span aria-hidden="true">Aa</span>
        <span class="hidden sm:inline">Accessibilité</span>
      </button>

      @if (isAccessibilityPanelOpen()) {
        <div
          id="accessibility-panel"
          class="absolute left-0 top-full z-50 mt-2 w-72 border border-[var(--border)] bg-[var(--bg-secondary)] p-4 text-[var(--text-primary)] shadow-lg"
          aria-label="Préférences d'accessibilité"
        >
          <p class="mb-3 font-semibold">Taille du texte</p>
          <div class="mb-5 grid grid-cols-3 gap-2">
            <button
              type="button"
              class="border border-[var(--border)] px-2 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
              [ngClass]="fontSize() === 'small' ? 'bg-[var(--bg-tertiary)]' : ''"
              [attr.aria-pressed]="fontSize() === 'small'"
              (click)="setFontSize('small')"
            >
              Petit
            </button>
            <button
              type="button"
              class="border border-[var(--border)] px-2 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
              [ngClass]="fontSize() === 'normal' ? 'bg-[var(--bg-tertiary)]' : ''"
              [attr.aria-pressed]="fontSize() === 'normal'"
              (click)="setFontSize('normal')"
            >
              Normal
            </button>
            <button
              type="button"
              class="border border-[var(--border)] px-2 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
              [ngClass]="fontSize() === 'large' ? 'bg-[var(--bg-tertiary)]' : ''"
              [attr.aria-pressed]="fontSize() === 'large'"
              (click)="setFontSize('large')"
            >
              Grand
            </button>
          </div>

          <button
            type="button"
            class="flex w-full items-center justify-between border border-[var(--border)] px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
            [attr.aria-pressed]="isDarkMode()"
            (click)="toggleDarkMode()"
          >
            <span>Mode sombre</span>
            <span aria-hidden="true">{{ isDarkMode() ? 'Activé' : 'Désactivé' }}</span>
          </button>
        </div>
      }
    </div>

    <div class="justify-self-center">
      <span
        class="text-xl font-extrabold lowercase tracking-tight text-[var(--accent)] sm:text-2xl"
      >
        universcience
      </span>
    </div>

    <div
      class="flex items-center justify-self-end gap-2 border px-2 py-1.5 text-xs sm:px-3 sm:text-sm"
      [ngClass]="
        isConnected() ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'
      "
    >
      <span
        class="relative inline-flex h-2 w-2 rounded-full"
        [ngClass]="isConnected() ? 'bg-green-500 animate-pulse-slow' : 'bg-red-500'"
      ></span>
      <span
        class="hidden sm:inline"
        [ngClass]="isConnected() ? 'text-green-700' : 'text-red-700'"
      >
        {{ isConnected() ? 'Connected' : 'Disconnected' }}
      </span>
    </div>
  </div>
</header>
