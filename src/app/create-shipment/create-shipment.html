<div
  class="rounded-lg border border-[var(--border)] bg-[var(--bg-secondary)] p-6 shadow-sm"
>
  <h2 class="mb-6 text-2xl font-semibold text-[var(--text-primary)]">Create New Shipment</h2>

  <form [formGroup]="shipmentForm" (ngSubmit)="createShipment()" class="space-y-4">
    <div class="space-y-2">
      <label class="text-sm font-medium text-[var(--text-secondary)]">Origin</label>
      <input
        type="text"
        formControlName="origin"
        placeholder="e.g., New York, NY"
        class="flex h-10 w-full rounded-md border border-[var(--border)] bg-white px-3 py-2 text-sm text-[var(--text-primary)] placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
        [class.border-red-500]="hasError('origin')"
      />
      @if (hasError('origin')) {
        <p class="text-xs text-red-700">
          {{ getErrorMessage('origin') }}
        </p>
      }
    </div>

    <div class="space-y-2">
      <label class="text-sm font-medium text-[var(--text-secondary)]">Destination</label>
      <input
        type="text"
        formControlName="destination"
        placeholder="e.g., Los Angeles, CA"
        class="flex h-10 w-full rounded-md border border-[var(--border)] bg-white px-3 py-2 text-sm text-[var(--text-primary)] placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
        [class.border-red-500]="hasError('destination')"
      />
      @if (hasError('destination')) {
        <p class="text-xs text-red-700">
          {{ getErrorMessage('destination') }}
        </p>
      }
    </div>

    <div class="space-y-2">
      <label class="text-sm font-medium text-[var(--text-secondary)]">Estimated Delivery</label>
      <input
        type="text"
        formControlName="estimatedDelivery"
        placeholder="e.g., 3-5 business days"
        class="flex h-10 w-full rounded-md border border-[var(--border)] bg-white px-3 py-2 text-sm text-[var(--text-primary)] placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
      />
    </div>

    <button
      type="submit"
      [disabled]="isSubmitting()"
      class="inline-flex h-10 w-full items-center justify-center rounded-md bg-[var(--accent)] px-4 py-2 text-sm font-medium text-white hover:bg-[var(--accent-dark)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)] focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ isSubmitting() ? 'Creating...' : 'Create Shipment' }}
    </button>
  </form>
</div>
