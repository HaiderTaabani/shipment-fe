<div
  class="rounded-lg border border-[var(--border)] bg-[var(--bg-secondary)] p-6 shadow-sm"
>
  <h2 class="mb-6 text-2xl font-semibold text-[var(--text-primary)]">
    Ajouter une exposition
  </h2>

  <form [formGroup]="shipmentForm" (ngSubmit)="createShipment()" class="space-y-4">
    <div class="space-y-2">
      <label for="origin" class="text-sm font-medium text-[var(--text-secondary)]">
        Site de départ
      </label>
      <input
        id="origin"
        type="text"
        formControlName="origin"
        placeholder="Ex. : Paris"
        class="flex h-10 w-full rounded-md border border-[var(--border)] bg-[var(--bg-secondary)] px-3 py-2 text-sm text-[var(--text-primary)] placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
        [class.border-red-500]="hasError('origin')"
      />
      @if (hasError('origin')) {
        <p class="text-xs text-red-700">
          {{ getErrorMessage('origin') }}
        </p>
      }
    </div>

    <div class="space-y-2">
      <label for="destination" class="text-sm font-medium text-[var(--text-secondary)]">
        Lieu d'accueil
      </label>
      <input
        id="destination"
        type="text"
        formControlName="destination"
        placeholder="Ex. : Cité des sciences et de l'industrie"
        class="flex h-10 w-full rounded-md border border-[var(--border)] bg-[var(--bg-secondary)] px-3 py-2 text-sm text-[var(--text-primary)] placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
        [class.border-red-500]="hasError('destination')"
      />
      @if (hasError('destination')) {
        <p class="text-xs text-red-700">
          {{ getErrorMessage('destination') }}
        </p>
      }
    </div>

    <div class="space-y-2">
      <label for="estimated-delivery" class="text-sm font-medium text-[var(--text-secondary)]">
        Arrivée prévue
      </label>
      <input
        id="estimated-delivery"
        type="text"
        formControlName="estimatedDelivery"
        placeholder="Ex. : 3 à 5 jours ouvrés"
        class="flex h-10 w-full rounded-md border border-[var(--border)] bg-[var(--bg-secondary)] px-3 py-2 text-sm text-[var(--text-primary)] placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
      />
    </div>

    <button
      type="submit"
      [disabled]="isSubmitting()"
      class="inline-flex h-10 w-full items-center justify-center rounded-md bg-[var(--accent)] px-4 py-2 text-sm font-medium text-white hover:bg-[var(--accent-dark)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)] focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ isSubmitting() ? 'Ajout en cours...' : "Ajouter l'exposition" }}
    </button>
  </form>
</div>
