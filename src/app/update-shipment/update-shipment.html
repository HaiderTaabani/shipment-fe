<div class="rounded-lg border border-[var(--border)] bg-white p-6 shadow-sm">
  <h2 class="mb-6 text-2xl font-semibold text-[var(--text-primary)]">Update Shipment Status</h2>

  @if (errorMessage()) {
    <div class="mb-4 rounded-md border border-red-200 bg-red-50 p-3">
      <p class="text-sm text-red-700">{{ errorMessage() }}</p>
    </div>
  }

  @if (isLoading()) {
    <div class="flex justify-center items-center py-8">
      <p class="text-[var(--text-secondary)]">Loading shipments...</p>
    </div>
  } @else {
    <form [formGroup]="updateForm" (ngSubmit)="updateShipment()" class="space-y-4">
      <div class="space-y-2">
        <label class="text-sm font-medium text-[var(--text-secondary)]">Select Shipment</label>
        <select
          formControlName="shipmentId"
          (change)="onSelectShipmentId()"
          class="flex h-10 w-full rounded-md border border-[var(--border)] bg-white px-3 py-2 text-sm text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
          [class.border-red-500]="hasError('shipmentId')"
        >
          <option [ngValue]="null">-- Select a shipment --</option>
          @for (shipment of shipments(); track shipment.id) {
            <option [ngValue]="shipment.id">
              {{ shipment.trackingNumber }} - {{ shipment.destination }}
            </option>
          }
        </select>
        @if (hasError('shipmentId')) {
          <p class="text-xs text-red-700">{{ getErrorMessage('shipmentId') }}</p>
        }
      </div>

      <div class="space-y-2">
        <label class="text-sm font-medium text-[var(--text-secondary)]">New Status</label>
        <select
          formControlName="status"
          class="flex h-10 w-full rounded-md border border-[var(--border)] bg-white px-3 py-2 text-sm text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
          [class.border-red-500]="hasError('status')"
        >
          @for (status of statusOptions; track status) {
            <option [ngValue]="status">{{ STATUS_LABELS[status] }}</option>
          }
        </select>
        @if (hasError('status')) {
          <p class="text-xs text-red-700">{{ getErrorMessage('status') }}</p>
        }
      </div>

      <div class="space-y-2">
        <label class="text-sm font-medium text-[var(--text-secondary)]">Current Location</label>
        <input
          type="text"
          formControlName="currentLocation"
          placeholder="e.g., Chicago Distribution Center"
          class="flex h-10 w-full rounded-md border border-[var(--border)] bg-white px-3 py-2 text-sm text-[var(--text-primary)] placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
        />
      </div>

      <button
        type="submit"
        [disabled]="updateForm.invalid || isSubmitting()"
        class="inline-flex h-10 w-full items-center justify-center rounded-md bg-[var(--accent)] px-4 py-2 text-sm font-medium text-white hover:bg-[var(--accent-dark)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)] focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ isSubmitting() ? 'Updating...' : 'Update Status' }}
      </button>
    </form>
  }
</div>
